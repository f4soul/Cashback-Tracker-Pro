      <div class="flex items-center justify-between px-4 pt-1.5 pb-3 border-b border-[var(--hairline)]">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-9 h-9 rounded-full bg-[#FFDD2D] flex items-center justify-center text-[15px] font-black text-black shrink-0">Т</div>

    <!-- Скролл-тело -->
    <div class="flex-1 overflow-y-auto no-scrollbar overscroll-contain px-4 pt-3 pb-2 flex flex-col gap-3">

        <div class="flex items-center gap-1.5 pl-1 pr-2.5 py-2">

        </div>
        <div class="flex items-center gap-1.5 pl-1 pr-2.5 py-2">

            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
          </button>

            Путешествия

          <button class="h-8 px-3 rounded-full bg-[var(--fill)] border border-[var(--hairline)] text-[var(--t2)] text-[12.5px] font-medium flex items-center gap-1.5 active:scale-95 transition-transform">
            Аптеки

            <button class="w-6 h-6 rounded-full bg-[var(--fill-hover)] text-[var(--t2)] flex items-center justify-center mr-0.5">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </span>
          <button class="h-8 px-3 rounded-full bg-[var(--fill)] border border-[var(--hairline)] text-[var(--t2)] text-[12.5px] font-medium flex items-center gap-1.5 active:scale-95 transition-transform">
            Электроника
            <svg class="text-[var(--t3)]" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="h-8 px-3 rounded-full bg-[var(--fill)] border border-[var(--hairline)] text-[var(--t2)] text-[12.5px] font-medium flex items-center gap-1.5 active:scale-95 transition-transform">

          </button>
          <button class="h-8 px-3 rounded-full bg-[var(--fill)] border border-[var(--hairline)] text-[var(--t2)] text-[12.5px] font-medium flex items-center gap-1.5 active:scale-95 transition-transform">
            Такси
            <svg class="text-[var(--t3)]" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="h-8 px-3 rounded-full bg-[var(--fill)] border border-[var(--hairline)] text-[var(--t2)] text-[12.5px] font-medium flex items-center gap-1.5 active:scale-95 transition-transform">
            Животные
            <svg class="text-[var(--t3)]" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="h-8 px-3 rounded-full bg-[var(--fill)] border border-[var(--hairline)] text-[var(--t2)] text-[12.5px] font-medium flex items-center gap-1.5 active:scale-95 transition-transform">
            Дом и ремонт
            <svg class="text-[var(--t3)]" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>

    <!-- Футер: одна большая CTA (отмена = свайп/крестик) -->
    <div class="shrink-0 border-t border-[var(--hairline)] bg-[var(--surface-2)] px-4 pt-3 pb-[max(14px,env(safe-area-inset-bottom))]">
      <button class="w-full h-12 rounded-[13px] font-bold text-[15px] text-white bg-[var(--accent)] shadow-md active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
        Сохранить банк
        <span class="text-[12px] font-bold px-1.5 py-0.5 rounded-md bg-white/20">3 категории · до 13%</span>
      </button>
    </div>
  </div>
</div>
