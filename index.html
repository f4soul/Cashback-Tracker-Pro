<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" id="theme-color-meta" content="#FAFAFA" />
    <meta name="description" content="Умный трекер кэшбека и банковских карт. Отслеживайте свои категории и оптимизируйте расходы." />
    
    <!-- PWA / iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Cashback Pro">

    <!-- Inline script to apply theme during early load (prevents status bar flashing in PWA) -->
    <script>
      (function() {
        var theme = 'light';
        try {
          var savedTheme = localStorage.getItem('theme');
          if (savedTheme) {
            if (savedTheme.indexOf('dark') !== -1) {
              theme = 'dark';
            } else if (savedTheme.indexOf('light') !== -1) {
              theme = 'light';
            }
          } else {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              theme = 'dark';
            }
          }
        } catch (e) {}

        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        var targetColor = theme === 'dark' ? '#0A0A0A' : '#FAFAFA';
        document.documentElement.style.backgroundColor = targetColor;
        document.addEventListener('DOMContentLoaded', function() {
          var meta = document.getElementById('theme-color-meta');
          if (meta) {
            meta.setAttribute('content', targetColor);
          }
        });
      })();
    </script>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cashback-tracker.pro/" />
    <meta property="og:title" content="Cashback Tracker Pro" />
    <meta property="og:description" content="Умный трекер кэшбека и банковских карт. Все ваши бонусы в одном месте." />
    <meta property="og:image" content="https://cashback-tracker.pro/icon.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Cashback Tracker Pro" />
    <meta property="twitter:description" content="Умный трекер кэшбека и банковских карт. Все ваши бонусы в одном месте." />
    <meta property="twitter:image" content="https://cashback-tracker.pro/icon.svg" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png?v=2" type="image/png">
    <link rel="icon" href="/icon.svg?v=2" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
    <title>Cashback Tracker Pro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
