<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Динамическая тема цвета -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Умный трекер кэшбека и банковских карт. Отслеживайте свои категории и оптимизируйте расходы." />
    
    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cashback Tracker">

    <!-- Inline script  -->
    <script>
      (function () {
        try {
          const saved = localStorage.getItem('theme');
          const isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          const root = document.documentElement;
          if (isDark) root.classList.add('dark');
          else root.classList.remove('dark');
          
          const color = isDark ? '#0A0A0A' : '#FAFAFA';
          root.style.setProperty('background-color', color, 'important');
          
          // Force update meta
          document.querySelectorAll('meta[name="theme-color"][media]').forEach(m => m.remove());
          const meta = document.querySelector('meta[name="theme-color"]:not([media])');
          if (meta) meta.setAttribute('content', color);
        } catch(e) {}
      })();
    </script>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cashback-tracker.pro/" />
    <meta property="og:title" content="Cashback Tracker Pro" />
    <meta property="og:description" content="Умный трекер кэшбека." />
    <meta property="og:image" content="https://cashback-tracker.pro/icon.svg?v=4" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Cashback Tracker Pro" />
    <meta property="twitter:description" content="Умный трекер кэшбека." />
    <meta property="twitter:image" content="https://cashback-tracker.pro/icon.svg?v=4" />

    <link rel="manifest" href="/manifest.json?v=4" />
    <link rel="shortcut icon" href="/favicon.ico?v=4" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png?v=4" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png?v=4" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png?v=4" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-prec.png?v=4" />
    <title>Cashback Tracker Pro</title>
  </head>

    <div id="root"></div>

  </body>
</html>
